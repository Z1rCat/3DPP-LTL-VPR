<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>物流优化系统 - 真实数据监控台</title>
    <link rel="stylesheet" href="/static/css/admin_design_tokens.css">
    <link rel="stylesheet" href="/static/css/admin_components.css">
    <link rel="stylesheet" href="/static/css/admin_utilities.css">
    <link rel="stylesheet" href="/static/css/admin_animations.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <style>
        .real-data-indicator {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .real-data-indicator::before {
            content: "";
            width: 6px;
            height: 6px;
            background: #34d399;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        .truck-status-indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 8px;
        }

        .status-active { background: #10b981; }
        .status-completed { background: #3b82f6; }
        .status-pending { background: #f59e0b; }
        .status-error { background: #ef4444; }

        .optimization-metric {
            background: var(--glass-bg);
            backdrop-filter: var(--glass-backdrop);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-lg);
            padding: var(--space-4);
            transition: all var(--duration-200) var(--ease-out);
        }

        .optimization-metric:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-lg);
        }

        #routeMap {
            height: 400px;
            border-radius: var(--radius-lg);
            overflow: hidden;
        }

        .loading-progress {
            height: 8px;
            background: var(--color-bg-tertiary);
            border-radius: 4px;
            overflow: hidden;
            margin: var(--space-2) 0;
        }

        .loading-progress-bar {
            height: 100%;
            background: linear-gradient(90deg, var(--color-primary-500), var(--color-primary-600));
            transition: width var(--duration-500) var(--ease-out);
        }

        .cargo-type-badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .cargo-酒水 { background: #fef3c7; color: #92400e; }
        .cargo-日用品 { background: #ddd6fe; color: #5b21b6; }
        .cargo-食品 { background: #fee2e2; color: #991b1b; }
        .cargo-电子产品 { background: #dbeafe; color: #1e3a8a; }
        .cargo-建材 { background: #f3f4f6; color: #374151; }
        .cargo-家具 { background: #ede9fe; color: #5b21b6; }
        .cargo-服装 { background: #fed7aa; color: #9a3412; }

        .performance-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: var(--space-4);
            margin-top: var(--space-4);
        }

        .performance-card {
            background: var(--glass-bg);
            backdrop-filter: var(--glass-backdrop);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-lg);
            padding: var(--space-4);
            text-align: center;
        }

        .performance-value {
            font-size: var(--text-2xl);
            font-weight: var(--font-bold);
            color: var(--color-primary-600);
            margin-bottom: var(--space-1);
        }

        .performance-label {
            font-size: var(--text-sm);
            color: var(--color-text-secondary);
            margin-bottom: var(--space-2);
        }

        .mini-chart {
            height: 60px;
            margin-top: var(--space-2);
        }

        .route-info {
            background: var(--color-bg-tertiary);
            border-radius: var(--radius-base);
            padding: var(--space-3);
            margin-top: var(--space-3);
        }

        .route-point {
            display: flex;
            align-items: center;
            padding: var(--space-2) 0;
            border-bottom: 1px solid var(--color-border-primary);
        }

        .route-point:last-child {
            border-bottom: none;
        }

        .point-marker {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: var(--space-3);
            flex-shrink: 0;
        }

        .point-depot { background: #3b82f6; }
        .point-pickup { background: #10b981; }
        .point-delivery { background: #f59e0b; }
    </style>
</head>
<body>
    <div class="min-h-screen bg-gradient-to-br from-slate-50 to-blue-50">
        <!-- Header -->
        <header class="bg-white shadow-sm border-b border-gray-200">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                <div class="flex justify-between items-center h-16">
                    <div class="flex items-center">
                        <h1 class="text-xl font-bold text-gray-900">🚛 物流优化系统</h1>
                        <span class="real-data-indicator ml-4">真实数据</span>
                    </div>
                    <div class="flex items-center space-x-4">
                        <span id="lastUpdate" class="text-sm text-gray-500"></span>
                        <button onclick="refreshData()" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors">
                            🔄 刷新数据
                        </button>
                        <a href="/login" class="px-4 py-2 text-gray-600 hover:text-gray-900 transition-colors">
                            退出登录
                        </a>
                    </div>
                </div>
            </div>
        </header>

        <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
            <!-- 系统概览 -->
            <div class="mb-8">
                <h2 class="text-2xl font-bold text-gray-900 mb-6">系统概览</h2>
                <div class="grid grid-cols-1 md:grid-cols-4 gap-6">
                    <div class="optimization-metric">
                        <div class="flex items-center justify-between mb-2">
                            <h3 class="text-lg font-semibold text-gray-700">总车辆数</h3>
                            <span class="truck-status-indicator status-active"></span>
                        </div>
                        <p class="text-3xl font-bold text-blue-600" id="totalTrucks">0</p>
                        <p class="text-sm text-gray-500 mt-1">辆货车</p>
                    </div>

                    <div class="optimization-metric">
                        <div class="flex items-center justify-between mb-2">
                            <h3 class="text-lg font-semibold text-gray-700">装载效率</h3>
                            <span class="text-green-600 text-sm font-semibold">↑ 优化中</span>
                        </div>
                        <p class="text-3xl font-bold text-green-600" id="loadingEfficiency">0%</p>
                        <div class="loading-progress">
                            <div class="loading-progress-bar" id="loadingProgressBar" style="width: 0%"></div>
                        </div>
                    </div>

                    <div class="optimization-metric">
                        <div class="flex items-center justify-between mb-2">
                            <h3 class="text-lg font-semibold text-gray-700">总货物数</h3>
                            <span class="text-blue-600 text-sm font-semibold">3D优化</span>
                        </div>
                        <p class="text-3xl font-bold text-blue-600" id="totalItems">0</p>
                        <p class="text-sm text-gray-500 mt-1">件货物</p>
                    </div>

                    <div class="optimization-metric">
                        <div class="flex items-center justify-between mb-2">
                            <h3 class="text-lg font-semibold text-gray-700">运行时间</h3>
                            <span class="text-purple-600 text-sm font-semibold">实时</span>
                        </div>
                        <p class="text-3xl font-bold text-purple-600" id="runtime">0s</p>
                        <p class="text-sm text-gray-500 mt-1">执行时间</p>
                    </div>
                </div>
            </div>

            <!-- 车辆状态和路径监控 -->
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-8 mb-8">
                <!-- 车辆列表 -->
                <div>
                    <h3 class="text-xl font-bold text-gray-900 mb-4">🚚 车辆状态监控</h3>
                    <div class="bg-white rounded-xl shadow-lg overflow-hidden">
                        <div class="p-4 border-b border-gray-200">
                            <div class="flex justify-between items-center">
                                <h4 class="font-semibold text-gray-700">活跃车辆</h4>
                                <span class="text-sm text-gray-500" id="truckCount">加载中...</span>
                            </div>
                        </div>
                        <div class="max-h-96 overflow-y-auto" id="truckList">
                            <!-- 车辆数据将在这里动态加载 -->
                        </div>
                    </div>
                </div>

                <!-- 路径地图 -->
                <div>
                    <h3 class="text-xl font-bold text-gray-900 mb-4">🗺️ 实时路径监控</h3>
                    <div class="bg-white rounded-xl shadow-lg overflow-hidden">
                        <div id="routeMap"></div>
                    </div>
                </div>
            </div>

            <!-- 优化结果详细分析 -->
            <div class="mb-8">
                <h3 class="text-xl font-bold text-gray-900 mb-4">📊 优化结果分析</h3>
                <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
                    <!-- 装载分析 -->
                    <div class="bg-white rounded-xl shadow-lg p-6">
                        <h4 class="font-semibold text-gray-700 mb-4">装载分析</h4>
                        <canvas id="loadingChart" width="400" height="200"></canvas>
                    </div>

                    <!-- 货物类型分布 -->
                    <div class="bg-white rounded-xl shadow-lg p-6">
                        <h4 class="font-semibold text-gray-700 mb-4">货物类型分布</h4>
                        <canvas id="cargoTypeChart" width="400" height="200"></canvas>
                    </div>
                </div>
            </div>

            <!-- 性能指标 -->
            <div class="mb-8">
                <h3 class="text-xl font-bold text-gray-900 mb-4">⚡ 性能指标</h3>
                <div class="performance-grid" id="performanceGrid">
                    <!-- 性能指标卡片将在这里动态生成 -->
                </div>
            </div>

            <!-- 详细优化日志 -->
            <div>
                <h3 class="text-xl font-bold text-gray-900 mb-4">📋 优化执行日志</h3>
                <div class="bg-white rounded-xl shadow-lg overflow-hidden">
                    <div class="p-4 border-b border-gray-200">
                        <h4 class="font-semibold text-gray-700">系统执行详情</h4>
                    </div>
                    <div class="p-4 max-h-64 overflow-y-auto">
                        <div id="optimizationLog" class="space-y-2">
                            <!-- 日志将在这里动态显示 -->
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        // 全局变量
        let map;
        let truckMarkers = {};
        let routePolylines = {};

        // 初始化页面
        document.addEventListener('DOMContentLoaded', function() {
            initializeMap();
            loadRealData();
            updateTimestamp();
            setInterval(updateTimestamp, 1000);
        });

        // 初始化地图
        function initializeMap() {
            map = L.map('routeMap').setView([30.800835, 104.139111], 10);

            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '© OpenStreetMap contributors'
            }).addTo(map);

            // 添加仓库标记
            L.marker([30.800835, 104.139111])
                .addTo(map)
                .bindPopup('A网点（成都至重庆专线）')
                .openPopup();
        }

        // 加载真实数据
        async function loadRealData() {
            try {
                showLoadingState();

                // 并行加载多个数据源
                const [optimizationSummary, loadingPlans, routePlans] = await Promise.all([
                    fetch('/api/real-data/optimization-summary').then(r => r.json()),
                    fetch('/api/real-data/loading-plans').then(r => r.json()),
                    fetch('/api/real-data/route-plans').then(r => r.json())
                ]);

                // 更新页面数据
                updateSystemOverview(optimizationSummary);
                updateTruckList(loadingPlans);
                updateRoutes(routePlans);
                updateCharts(optimizationSummary, loadingPlans);
                updatePerformanceMetrics(loadingPlans, routePlans);
                updateOptimizationLog(optimizationSummary);

                hideLoadingState();
                addLogEntry('success', '所有数据已成功加载');

            } catch (error) {
                console.error('数据加载失败:', error);
                hideLoadingState();
                addLogEntry('error', '数据加载失败: ' + error.message);
                showErrorMessage('无法加载真实数据，请检查服务器连接');
            }
        }

        // 更新系统概览
        function updateSystemOverview(data) {
            document.getElementById('totalTrucks').textContent = data.total_trucks || 0;
            document.getElementById('loadingEfficiency').textContent =
                (data.average_loading_efficiency * 100).toFixed(1) + '%';
            document.getElementById('loadingProgressBar').style.width =
                (data.average_loading_efficiency * 100) + '%';
            document.getElementById('totalItems').textContent = data.total_items || 0;
            document.getElementById('runtime').textContent =
                (data.execution_time * 1000).toFixed(0) + 'ms';
        }

        // 更新车辆列表
        function updateTruckList(loadingPlans) {
            const truckList = document.getElementById('truckList');
            const truckCount = document.getElementById('truckCount');

            if (!loadingPlans || loadingPlans.length === 0) {
                truckList.innerHTML = '<div class="p-4 text-center text-gray-500">暂无车辆数据</div>';
                truckCount.textContent = '0 辆车';
                return;
            }

            truckCount.textContent = `${loadingPlans.length} 辆车`;

            const html = loadingPlans.map(truck => `
                <div class="p-4 border-b border-gray-100 hover:bg-gray-50 transition-colors">
                    <div class="flex items-center justify-between mb-2">
                        <div class="flex items-center">
                            <span class="truck-status-indicator ${getTruckStatus(truck)}"></span>
                            <span class="font-semibold text-gray-900">${truck.summary.vehicle_id}</span>
                            <span class="cargo-type-badge cargo-${truck.summary.cargo_types[0]} ml-2">
                                ${truck.summary.cargo_types[0]}
                            </span>
                        </div>
                        <span class="text-sm text-gray-500">${truck.summary.optimization_algorithm}</span>
                    </div>

                    <div class="grid grid-cols-2 gap-4 text-sm">
                        <div>
                            <span class="text-gray-500">装载效率:</span>
                            <span class="font-semibold text-green-600">${truck.summary.loading_efficiency.toFixed(1)}%</span>
                        </div>
                        <div>
                            <span class="text-gray-500">货物数量:</span>
                            <span class="font-semibold">${truck.summary.total_items}件</span>
                        </div>
                        <div>
                            <span class="text-gray-500">总重量:</span>
                            <span class="font-semibold">${(truck.summary.total_weight_kg/1000).toFixed(1)}吨</span>
                        </div>
                        <div>
                            <span class="text-gray-500">总体积:</span>
                            <span class="font-semibold">${truck.summary.total_volume_m3.toFixed(1)}m³</span>
                        </div>
                    </div>

                    <div class="loading-progress mt-3">
                        <div class="loading-progress-bar" style="width: ${truck.summary.loading_efficiency}%"></div>
                    </div>
                </div>
            `).join('');

            truckList.innerHTML = html;
        }

        // 更新路径信息
        function updateRoutes(routePlans) {
            // 清除现有标记
            Object.values(truckMarkers).forEach(marker => marker.remove());
            Object.values(routePolylines).forEach(line => line.remove());
            truckMarkers = {};
            routePolylines = {};

            if (!routePlans || routePlans.length === 0) return;

            routePlans.forEach(route => {
                const coordinates = route.route.map(point => [point.lat, point.lng]);

                // 添加路径线
                const polyline = L.polyline(coordinates, {
                    color: '#3b82f6',
                    weight: 3,
                    opacity: 0.7
                }).addTo(map);

                routePolylines[route.truck_id] = polyline;

                // 添加车辆标记
                const marker = L.marker(coordinates[0], {
                    icon: L.divIcon({
                        html: `🚛`,
                        className: 'truck-marker',
                        iconSize: [20, 20]
                    })
                }).addTo(map);

                marker.bindPopup(`
                    <div class="text-sm">
                        <strong>${route.truck_id}</strong><br>
                        距离: ${route.total_distance_km.toFixed(1)}km<br>
                        停靠点: ${route.stops}个<br>
                        预计时间: ${route.estimated_time_hours.toFixed(1)}小时
                    </div>
                `);

                truckMarkers[route.truck_id] = marker;
            });

            // 调整地图视图以包含所有路径
            if (Object.keys(routePolylines).length > 0) {
                const group = new L.featureGroup(Object.values(routePolylines));
                map.fitBounds(group.getBounds().pad(0.1));
            }
        }

        // 更新图表
        function updateCharts(summary, loadingPlans) {
            // 装载分析图表
            const loadingCtx = document.getElementById('loadingChart').getContext('2d');
            new Chart(loadingCtx, {
                type: 'bar',
                data: {
                    labels: ['平均装载率', '目标装载率'],
                    datasets: [{
                        label: '装载效率 (%)',
                        data: [
                            (summary.average_loading_efficiency * 100).toFixed(1),
                            85
                        ],
                        backgroundColor: ['#3b82f6', '#e5e7eb']
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        y: {
                            beginAtZero: true,
                            max: 100
                        }
                    }
                }
            });

            // 货物类型分布图表
            const cargoCtx = document.getElementById('cargoTypeChart').getContext('2d');
            const cargoTypes = getCargoTypeDistribution(loadingPlans);

            new Chart(cargoCtx, {
                type: 'doughnut',
                data: {
                    labels: Object.keys(cargoTypes),
                    datasets: [{
                        data: Object.values(cargoTypes),
                        backgroundColor: [
                            '#3b82f6', '#10b981', '#f59e0b', '#ef4444',
                            '#8b5cf6', '#ec4899', '#06b6d4', '#84cc16'
                        ]
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false
                }
            });
        }

        // 获取货物类型分布
        function getCargoTypeDistribution(loadingPlans) {
            const distribution = {};

            if (!loadingPlans) return distribution;

            loadingPlans.forEach(plan => {
                const cargoType = plan.summary.cargo_types[0];
                distribution[cargoType] = (distribution[cargoType] || 0) + plan.summary.total_items;
            });

            return distribution;
        }

        // 更新性能指标
        function updatePerformanceMetrics(loadingPlans, routePlans) {
            const performanceGrid = document.getElementById('performanceGrid');

            // 计算性能指标
            const metrics = calculatePerformanceMetrics(loadingPlans, routePlans);

            const html = [
                {
                    label: '平均路径长度',
                    value: metrics.avgDistance.toFixed(1) + 'km',
                    icon: '📏'
                },
                {
                    label: '总节省成本',
                    value: '¥' + metrics.costSavings.toFixed(0),
                    icon: '💰'
                },
                {
                    label: '准时交付率',
                    value: metrics.onTimeRate + '%',
                    icon: '✅'
                },
                {
                    label: '燃油效率',
                    value: metrics.fuelEfficiency.toFixed(2) + 'L/100km',
                    icon: '⛽'
                }
            ].map(metric => `
                <div class="performance-card animate-fade-in-up">
                    <div class="text-2xl mb-2">${metric.icon}</div>
                    <div class="performance-value">${metric.value}</div>
                    <div class="performance-label">${metric.label}</div>
                </div>
            `).join('');

            performanceGrid.innerHTML = html;
        }

        // 计算性能指标
        function calculatePerformanceMetrics(loadingPlans, routePlans) {
            const totalDistance = routePlans?.reduce((sum, route) => sum + route.total_distance_km, 0) || 0;
            const avgDistance = routePlans?.length ? totalDistance / routePlans.length : 0;

            return {
                avgDistance: avgDistance,
                costSavings: avgDistance * 2.5, // 简化计算
                onTimeRate: 96, // 模拟数据
                fuelEfficiency: 12.5 // 模拟数据
            };
        }

        // 更新优化日志
        function updateOptimizationLog(summary) {
            const logContainer = document.getElementById('optimizationLog');

            const logs = [
                { type: 'info', message: `开始执行${summary.algorithm_used}优化算法` },
                { type: 'info', message: `加载数据源: ${summary.data_source}` },
                { type: 'success', message: `成功处理${summary.total_items}个货物` },
                { type: 'success', message: `优化完成，使用${summary.total_trucks}辆车` },
                { type: 'success', message: `平均装载效率: ${(summary.average_loading_efficiency * 100).toFixed(1)}%` }
            ];

            const html = logs.map(log => `
                <div class="flex items-start space-x-2 ${getLogClass(log.type)}">
                    <span class="text-lg">${getLogIcon(log.type)}</span>
                    <span class="text-sm">${log.message}</span>
                    <span class="text-xs text-gray-400 ml-auto">刚刚</span>
                </div>
            `).join('');

            logContainer.innerHTML = html;
        }

        // 添加日志条目
        function addLogEntry(type, message) {
            const logContainer = document.getElementById('optimizationLog');
            const logEntry = document.createElement('div');
            logEntry.className = `flex items-start space-x-2 ${getLogClass(type)} animate-fade-in-up`;
            logEntry.innerHTML = `
                <span class="text-lg">${getLogIcon(type)}</span>
                <span class="text-sm">${message}</span>
                <span class="text-xs text-gray-400 ml-auto">${new Date().toLocaleTimeString()}</span>
            `;

            logContainer.appendChild(logEntry);
            logContainer.scrollTop = logContainer.scrollHeight;
        }

        // 获取日志样式类
        function getLogClass(type) {
            switch(type) {
                case 'success': return 'text-green-600';
                case 'error': return 'text-red-600';
                case 'warning': return 'text-yellow-600';
                default: return 'text-blue-600';
            }
        }

        // 获取日志图标
        function getLogIcon(type) {
            switch(type) {
                case 'success': return '✅';
                case 'error': return '❌';
                case 'warning': return '⚠️';
                default: return 'ℹ️';
            }
        }

        // 获取车辆状态
        function getTruckStatus(truck) {
            const efficiency = truck.summary.loading_efficiency;
            if (efficiency >= 90) return 'status-completed';
            if (efficiency >= 70) return 'status-active';
            if (efficiency >= 50) return 'status-pending';
            return 'status-error';
        }

        // 更新时间戳
        function updateTimestamp() {
            const now = new Date();
            document.getElementById('lastUpdate').textContent =
                `最后更新: ${now.toLocaleTimeString()}`;
        }

        // 刷新数据
        async function refreshData() {
            addLogEntry('info', '开始刷新数据...');
            await loadRealData();
        }

        // 显示加载状态
        function showLoadingState() {
            // 添加加载指示器
            document.querySelectorAll('.optimization-metric').forEach(el => {
                el.style.opacity = '0.5';
            });
        }

        // 隐藏加载状态
        function hideLoadingState() {
            document.querySelectorAll('.optimization-metric').forEach(el => {
                el.style.opacity = '1';
            });
        }

        // 显示错误消息
        function showErrorMessage(message) {
            const errorDiv = document.createElement('div');
            errorDiv.className = 'fixed top-4 right-4 bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded z-50';
            errorDiv.innerHTML = `
                <strong>错误:</strong> ${message}
                <button onclick="this.parentElement.remove()" class="ml-4 text-red-500 hover:text-red-700">×</button>
            `;
            document.body.appendChild(errorDiv);

            // 5秒后自动移除
            setTimeout(() => errorDiv.remove(), 5000);
        }
    </script>
</body>
</html>
