<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>巧满装载平台 - 高级管理控制台</title>

    <!-- 预加载关键CSS -->
    <link rel="preload" href="/static/css/admin_design_tokens.css" as="style">
    <link rel="preload" href="/static/css/admin_components.css" as="style">
    <link rel="preload" href="/static/css/admin_utilities.css" as="style">
    <link rel="preload" href="/static/css/admin_animations.css" as="style">

    <!-- 设计系统 -->
    <link rel="stylesheet" href="/static/css/admin_design_tokens.css">
    <link rel="stylesheet" href="/static/css/admin_components.css">
    <link rel="stylesheet" href="/static/css/admin_utilities.css">
    <link rel="stylesheet" href="/static/css/admin_animations.css">

    <!-- 外部字体和图标 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">

    <!-- 地图和图表库 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.css">

    <style>
        /* 临时样式，后续将移至独立CSS文件 */
        .sidebar {
            background: linear-gradient(180deg, rgba(10, 10, 10, 0.95) 0%, rgba(23, 23, 23, 0.95) 100%);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }

        .main-content {
            background: radial-gradient(ellipse at top, rgba(59, 130, 246, 0.05) 0%, transparent 50%),
                        linear-gradient(180deg, #0a0a0a 0%, #171717 100%);
            min-height: 100vh;
        }

        /* 实时地图容器 */
        .map-container {
            height: 400px;
            border-radius: var(--radius-xl);
            overflow: hidden;
            position: relative;
        }

        #liveMap {
            height: 100%;
            width: 100%;
            z-index: 1;
        }

        .map-overlay {
            position: absolute;
            top: var(--space-4);
            right: var(--space-4);
            background: var(--glass-bg);
            backdrop-filter: var(--glass-backdrop);
            -webkit-backdrop-filter: var(--glass-backdrop);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-lg);
            padding: var(--space-3);
            z-index: 10;
        }

        /* 车辆状态卡片 */
        .vehicle-card {
            position: relative;
            overflow: hidden;
        }

        .vehicle-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: var(--gradient-primary);
        }

        .vehicle-card.online::before {
            background: linear-gradient(90deg, var(--color-success), #059669);
        }

        .vehicle-card.offline::before {
            background: linear-gradient(90deg, var(--color-text-tertiary), #6b7280);
        }

        .vehicle-card.busy::before {
            background: linear-gradient(90deg, var(--color-warning), #d97706);
        }

        /* 响应式地图 */
        @media (max-width: 768px) {
            .map-container {
                height: 300px;
            }
        }

        /* 数据可视化增强 */
        .chart-container {
            position: relative;
            height: 300px;
            background: var(--color-bg-secondary);
            border: 1px solid var(--color-border-primary);
            border-radius: var(--radius-xl);
            padding: var(--space-4);
        }

        /* 加载骨架屏 */
        .skeleton-text {
            height: 1rem;
            margin-bottom: var(--space-2);
            border-radius: var(--radius-base);
        }

        .skeleton-title {
            height: 1.5rem;
            width: 60%;
            margin-bottom: var(--space-4);
        }

        /* 实时指示器 */
        .live-indicator {
            display: inline-flex;
            align-items: center;
            gap: var(--space-2);
            padding: var(--space-2) var(--space-3);
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.2);
            border-radius: var(--radius-full);
            font-size: var(--text-xs);
            font-weight: var(--font-medium);
            color: var(--color-success);
        }

        .live-dot {
            width: 6px;
            height: 6px;
            background: var(--color-success);
            border-radius: var(--radius-full);
            animation: pulse 2s infinite;
        }

        /* 自定义滚动条 */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: var(--color-bg-tertiary);
            border-radius: var(--radius-base);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--color-border-secondary);
            border-radius: var(--radius-base);
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--color-border-primary);
        }
    </style>
</head>
<body>
    <!-- 应用主容器 -->
    <div class="app-container">

        <!-- 侧边栏导航 -->
        <aside class="sidebar animate-slide-in-left">

            <!-- 导航菜单 -->

                <div class="nav-item">

                </div>
                <div class="nav-item">
                    <a href="#analytics" class="nav-link" data-page="analytics">

                <div class="pt-4 mt-4 border-t border-primary">

            <!-- 底部用户信息 -->

                    <button class="text-tertiary hover:text-primary transition-colors">

            </div>
        </aside>

        <!-- 顶部导航栏 -->
        <header class="header animate-fade-in-down">
            <div class="flex items-center gap-4">
                <!-- 移动端菜单按钮 -->
                <button class="lg:hidden btn btn-ghost" id="mobileMenuBtn">

                <!-- 搜索框 -->
                <div class="search-input flex-1 max-w-md">
                    <input type="text" class="form-control" placeholder="搜索车辆、订单、司机..." id="globalSearch">
                    <button class="absolute right-3 top-1/2 -translate-y-1/2 text-tertiary hover:text-primary">

                <!-- 快捷操作按钮 -->
                <div class="flex items-center gap-2">
                    <button class="btn btn-ghost btn-sm" title="刷新" id="refreshBtn">

                    <button class="btn btn-ghost btn-sm" title="通知" id="notificationBtn">

            <!-- 右侧操作区 -->
            <div class="flex items-center gap-4">
                <!-- 实时状态 -->

        <!-- 主内容区域 -->
        <main class="main-content" id="mainContent">
            <!-- 仪表板页面 -->

                <!-- 顶部统计卡片 -->
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 mb-6">

                                <i class="fas fa-truck text-primary"></i>
                            </div>
                        </div>
                    </div>

                    <div class="metric-card animate-fade-in-up delay-200">
                        <div class="flex items-start justify-between">
                            <div>
                                <p class="text-tertiary text-sm mb-1">活跃车辆</p>
                                <div class="metric-value animate-count-up" data-target="35">0</div>
                                <div class="metric-change positive">
                                    <i class="fas fa-arrow-up text-xs"></i>
                                    <span>8% 较昨日</span>
                                </div>
                            </div>
                            <div class="w-12 h-12 bg-success bg-opacity-10 rounded-lg flex items-center justify-center">
                                <i class="fas fa-map-marker-alt text-success"></i>
                            </div>
                        </div>
                    </div>

                    <div class="metric-card animate-fade-in-up delay-300">
                        <div class="flex items-start justify-between">
                            <div>
                                <p class="text-tertiary text-sm mb-1">今日订单</p>
                                <div class="metric-value animate-count-up" data-target="156">0</div>
                                <div class="metric-change negative">
                                    <i class="fas fa-arrow-down text-xs"></i>

                                <i class="fas fa-box text-warning"></i>

                    <div class="metric-card animate-fade-in-up delay-400">

                            <div>
                                <p class="text-tertiary text-sm mb-1">系统效率</p>
                                <div class="metric-value"><span class="animate-count-up" data-target="92">0</span>%</div>
                                <div class="metric-change positive">
                                    <i class="fas fa-arrow-up text-xs"></i>
                                    <span>5% 提升</span>
                                </div>
                            </div>
                            <div class="w-12 h-12 bg-info bg-opacity-10 rounded-lg flex items-center justify-center">
                                <i class="fas fa-tachometer-alt text-info"></i>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 实时地图和车辆状态 -->
                <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 mb-6">
                    <!-- 实时地图 -->
                    <div class="lg:col-span-2">
                        <div class="card animate-fade-in-up delay-500">
                            <div class="card-header">
                                <h3 class="card-title">
                                    <i class="fas fa-map-marked-alt"></i>
                                    实时车辆监控
                                </h3>
                                <div class="live-indicator">
                                    <div class="live-dot"></div>

                    <!-- 装载效率图表 -->
                    <div class="card animate-fade-in-up delay-800">
                        <div class="card-header">
                            <h4 class="card-title">
                                <i class="fas fa-chart-pie"></i>
                                装载效率分布
                            </h4>
                            <button class="btn btn-ghost btn-sm">
                                <i class="fas fa-download"></i>
                            </button>
                        </div>
                        <div class="card-body">

                            </div>
                        </div>

            </div>
        </main>
    </div>

    <!-- 移动端遮罩层 -->
    <div class="mobile-overlay" id="mobileOverlay"></div>

    <!-- JavaScript 库 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

    <!-- 应用JavaScript -->
    <script>
        // 应用状态管理
        const AppState = {
            currentPage: 'dashboard',
            vehicles: [],
            selectedVehicle: null,
            realTimeData: {},
            map: null,
            charts: {}
        };

        // 初始化应用
        document.addEventListener('DOMContentLoaded', function() {
            initializeApp();
            setupEventListeners();
            loadDashboardData();
            initializeRealTimeUpdates();
        });

        // 初始化应用
        function initializeApp() {
            // 创建时间轴动画
            gsap.timeline()
                .to('.animate-fade-in-up', {
                    opacity: 1,
                    y: 0,
                    duration: 0.6,
                    stagger: 0.1,
                    ease: 'power2.out'
                })
                .to('.animate-fade-in-down', {
                    opacity: 1,
                    y: 0,
                    duration: 0.5,
                    ease: 'power2.out'
                }, 0.2)
                .to('.animate-slide-in-left', {
                    opacity: 1,
                    x: 0,
                    duration: 0.7,
                    ease: 'power2.out'
                }, 0.1);
        }

        // 设置事件监听器
        function setupEventListeners() {
            // 导航点击事件
            document.querySelectorAll('.nav-link').forEach(link => {
                link.addEventListener('click', function(e) {
                    e.preventDefault();
                    const page = this.dataset.page;
                    if (page) {
                        switchPage(page);
                    }
                });
            });

            // 移动端菜单
            const mobileMenuBtn = document.getElementById('mobileMenuBtn');
            const mobileOverlay = document.getElementById('mobileOverlay');
            const sidebar = document.querySelector('.sidebar');

            if (mobileMenuBtn) {
                mobileMenuBtn.addEventListener('click', function() {
                    sidebar.classList.toggle('open');
                    mobileOverlay.classList.toggle('show');
                });
            }

            if (mobileOverlay) {
                mobileOverlay.addEventListener('click', function() {
                    sidebar.classList.remove('open');
                    this.classList.remove('show');
                });
            }

            // 搜索功能
            const searchInput = document.getElementById('globalSearch');
            if (searchInput) {
                searchInput.addEventListener('input', debounce(handleSearch, 300));
            }

            // 刷新按钮
            const refreshBtn = document.getElementById('refreshBtn');
            if (refreshBtn) {
                refreshBtn.addEventListener('click', function() {
                    this.querySelector('i').classList.add('fa-spin');
                    setTimeout(() => {
                        this.querySelector('i').classList.remove('fa-spin');
                        refreshData();
                    }, 1000);
                });
            }

            // 全屏按钮
            const fullscreenBtn = document.getElementById('fullscreenBtn');
            if (fullscreenBtn) {
                fullscreenBtn.addEventListener('click', toggleFullscreen);
            }
        }

        // 页面切换
        function switchPage(page) {
            // 更新导航状态
            document.querySelectorAll('.nav-link').forEach(link => {
                link.classList.remove('active');
            });
            document.querySelector(`[data-page="${page}"]`).classList.add('active');

            // 更新内容区域 - 这里可以加载不同的页面内容
            console.log('切换到页面:', page);
        }

        // 加载仪表板数据
        function loadDashboardData() {
            // 模拟数据加载
            setTimeout(() => {
                initializeMap();
                initializeCharts();
                loadVehicleData();
                animateCounters();
            }, 500);
        }

        // 初始化地图
        function initializeMap() {
            const mapContainer = document.getElementById('liveMap');
            if (!mapContainer) return;

            // 初始化 Leaflet 地图
            AppState.map = L.map('liveMap').setView([30.5728, 104.0668], 12);

            // 添加地图图层
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '© OpenStreetMap contributors'
            }).addTo(AppState.map);

            // 添加示例车辆标记
            const vehicles = [
                { id: 1, lat: 30.5728, lng: 104.0668, status: 'online', driver: '张师傅', plate: '川A12345' },
                { id: 2, lat: 30.5828, lng: 104.0768, status: 'busy', driver: '李师傅', plate: '川A23456' },
                { id: 3, lat: 30.5628, lng: 104.0568, status: 'online', driver: '王师傅', plate: '川A34567' },
                { id: 4, lat: 30.5928, lng: 104.0868, status: 'offline', driver: '赵师傅', plate: '川A45678' }
            ];

            vehicles.forEach(vehicle => {
                const markerColor = vehicle.status === 'online' ? '#10b981' :
                                   vehicle.status === 'busy' ? '#f59e0b' : '#6b7280';

                const marker = L.circleMarker([vehicle.lat, vehicle.lng], {
                    radius: 8,
                    fillColor: markerColor,
                    color: '#fff',
                    weight: 2,
                    opacity: 1,
                    fillOpacity: 0.8
                }).addTo(AppState.map);

                marker.bindPopup(`
                    <div style="font-family: 'Inter', sans-serif;">
                        <strong>车牌: ${vehicle.plate}</strong><br>
                        司机: ${vehicle.driver}<br>
                        状态: ${getStatusText(vehicle.status)}
                    </div>
                `);

                vehicle.marker = marker;
                AppState.vehicles.push(vehicle);
            });
        }

        // 初始化图表
        function initializeCharts() {
            // 路径优化趋势图
            const routeCtx = document.getElementById('routeChart');
            if (routeCtx) {
                AppState.charts.route = new Chart(routeCtx, {
                    type: 'line',
                    data: {
                        labels: ['00:00', '04:00', '08:00', '12:00', '16:00', '20:00', '24:00'],
                        datasets: [{
                            label: '优化路径',
                            data: [12, 19, 23, 25, 22, 30, 28],
                            borderColor: '#3b82f6',
                            backgroundColor: 'rgba(59, 130, 246, 0.1)',
                            tension: 0.4,
                            fill: true
                        }, {
                            label: '原始路径',
                            data: [15, 22, 28, 30, 26, 35, 32],
                            borderColor: '#ef4444',
                            backgroundColor: 'rgba(239, 68, 68, 0.1)',
                            tension: 0.4,
                            fill: true
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: {
                                labels: { color: '#9ca3af' }
                            }
                        },
                        scales: {
                            x: {
                                grid: { color: 'rgba(255, 255, 255, 0.1)' },
                                ticks: { color: '#9ca3af' }
                            },
                            y: {
                                grid: { color: 'rgba(255, 255, 255, 0.1)' },
                                ticks: { color: '#9ca3af' }
                            }
                        }
                    }
                });
            }

            // 装载效率分布图
            const loadingCtx = document.getElementById('loadingChart');
            if (loadingCtx) {
                AppState.charts.loading = new Chart(loadingCtx, {
                    type: 'doughnut',
                    data: {
                        labels: ['优秀 (>90%)', '良好 (80-90%)', '一般 (60-80%)', '较差 (<60%)'],
                        datasets: [{
                            data: [35, 40, 20, 5],
                            backgroundColor: ['#10b981', '#3b82f6', '#f59e0b', '#ef4444'],
                            borderWidth: 0
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: {
                                position: 'right',
                                labels: { color: '#9ca3af' }
                            }
                        }
                    }
                });
            }
        }

        // 加载车辆数据
        function loadVehicleData() {
            const vehicleList = document.getElementById('vehicleList');
            if (!vehicleList) return;

            // 生成车辆卡片HTML
            const vehicles = [
                { id: 1, plate: '川A12345', driver: '张师傅', status: 'online', load: 85, route: '成都->重庆', nextStop: '服务区A' },
                { id: 2, plate: '川A23456', driver: '李师傅', status: 'busy', load: 92, route: '成都->绵阳', nextStop: '配送点B' },
                { id: 3, plate: '川A34567', driver: '王师傅', status: 'online', load: 67, route: '成都->德阳', nextStop: '仓库C' },
                { id: 4, plate: '川A45678', driver: '赵师傅', status: 'offline', load: 0, route: '休息中', nextStop: '-' }
            ];

            vehicleList.innerHTML = vehicles.map(vehicle => `
                <div class="p-4 hover:bg-tertiary transition-colors cursor-pointer vehicle-card ${vehicle.status}" data-vehicle-id="${vehicle.id}">
                    <div class="flex items-start justify-between">
                        <div class="flex-1">
                            <div class="flex items-center gap-2 mb-2">
                                <span class="font-semibold text-primary">${vehicle.plate}</span>
                                <span class="status-badge status-${vehicle.status}">
                                    ${getStatusText(vehicle.status)}
                                </span>
                            </div>
                            <p class="text-sm text-secondary mb-1">司机: ${vehicle.driver}</p>
                            <p class="text-xs text-tertiary mb-2">路线: ${vehicle.route}</p>
                            <div class="flex items-center gap-4 text-xs">
                                <span class="text-secondary">装载率: <span class="text-primary font-semibold">${vehicle.load}%</span></span>
                                <span class="text-secondary">下站: ${vehicle.nextStop}</span>
                            </div>
                        </div>
                        <button class="btn btn-ghost btn-sm">
                            <i class="fas fa-ellipsis-v"></i>
                        </button>
                    </div>
                </div>
            `).join('');

            // 添加车辆卡片点击事件
            document.querySelectorAll('.vehicle-card').forEach(card => {
                card.addEventListener('click', function() {
                    const vehicleId = this.dataset.vehicleId;
                    showVehicleDetails(vehicleId);
                });
            });
        }

        // 显示车辆详情
        function showVehicleDetails(vehicleId) {
            const vehicle = AppState.vehicles.find(v => v.id == vehicleId);
            if (vehicle && vehicle.marker) {
                vehicle.marker.openPopup();
                AppState.map.setView([vehicle.lat, vehicle.lng], 15);
            }
        }

        // 获取状态文本
        function getStatusText(status) {
            const statusMap = {
                'online': '在线',
                'busy': '忙碌',
                'offline': '离线'
            };
            return statusMap[status] || '未知';
        }

        // 动画计数器
        function animateCounters() {
            document.querySelectorAll('.animate-count-up').forEach(counter => {
                const target = parseInt(counter.dataset.target);
                let current = 0;
                const increment = target / 50;
                const timer = setInterval(() => {
                    current += increment;
                    if (current >= target) {
                        current = target;
                        clearInterval(timer);
                    }
                    counter.textContent = Math.floor(current);
                }, 30);
            });
        }

        // 初始化实时更新
        function initializeRealTimeUpdates() {
            // 每5秒更新一次数据
            setInterval(() => {
                updateRealTimeData();
            }, 5000);
        }

        // 更新实时数据
        function updateRealTimeData() {
            // 模拟数据更新
            console.log('更新实时数据...');

            // 更新车辆位置（如果有GPS数据）
            if (AppState.vehicles.length > 0) {
                const randomVehicle = AppState.vehicles[Math.floor(Math.random() * AppState.vehicles.length)];
                if (randomVehicle.marker) {
                    // 随机移动车辆位置（模拟GPS更新）
                    const newLat = randomVehicle.lat + (Math.random() - 0.5) * 0.001;
                    const newLng = randomVehicle.lng + (Math.random() - 0.5) * 0.001;
                    randomVehicle.marker.setLatLng([newLat, newLng]);
                    randomVehicle.lat = newLat;
                    randomVehicle.lng = newLng;
                }
            }

            // 更新图表数据
            if (AppState.charts.route) {
                const newData = AppState.charts.route.data.datasets[0].data.map(
                    val => Math.max(10, Math.min(35, val + (Math.random() - 0.5) * 3))
                );
                AppState.charts.route.data.datasets[0].data = newData;
                AppState.charts.route.update('none');
            }
        }

        // 刷新数据
        function refreshData() {
            loadDashboardData();
        }

        // 搜索处理
        function handleSearch(e) {
            const query = e.target.value.toLowerCase();
            console.log('搜索:', query);
            // 实现搜索逻辑
        }

        // 切换全屏
        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen();
            } else {
                document.exitFullscreen();
            }
        }

        // 防抖函数
        function debounce(func, wait) {
            let timeout;
            return function executedFunction(...args) {
                const later = () => {
                    clearTimeout(timeout);
                    func(...args);
                };
                clearTimeout(timeout);
                timeout = setTimeout(later, wait);
            };
        }
    </script>
</body>
