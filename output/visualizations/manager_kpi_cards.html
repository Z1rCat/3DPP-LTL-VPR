<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KPI指标卡片 - 管理层</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #2d3748;
            min-height: 100vh;
            padding: 20px;
        }

        .dashboard-container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .dashboard-header {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 16px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(10px);
        }

        .dashboard-title {
            font-size: 32px;
            font-weight: 700;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 10px;
        }

        .kpi-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
            margin-bottom: 40px;
        }

        .kpi-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .kpi-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.15);
        }

        .kpi-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 4px;
            height: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .kpi-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .kpi-title {
            font-size: 16px;
            font-weight: 600;
            color: #718096;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .kpi-icon {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            color: white;
        }

        .kpi-value {
            font-size: 42px;
            font-weight: 800;
            margin-bottom: 15px;
            color: #2d3748;
            display: flex;
            align-items: baseline;
            gap: 5px;
        }

        .kpi-value .unit {
            font-size: 18px;
            font-weight: 500;
            color: #718096;
        }

        .kpi-change {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            width: fit-content;
        }

        .kpi-change.positive {
            background: rgba(76, 175, 80, 0.1);
            color: #4caf50;
        }

        .kpi-change.negative {
            background: rgba(244, 67, 54, 0.1);
            color: #f44336;
        }

        .kpi-change.neutral {
            background: rgba(255, 193, 7, 0.1);
            color: #ffc107;
        }

        .kpi-chart {
            height: 60px;
            margin-top: 20px;
            opacity: 0.8;
        }

        /* 主题色彩 */
        .revenue { --theme: #4caf50; }
        .orders { --theme: #2196f3; }
        .satisfaction { --theme: #ff9800; }
        .efficiency { --theme: #9c27b0; }
        .cost { --theme: #f44336; }
        .delivery { --theme: #00bcd4; }
        .vehicles { --theme: #795548; }
        .reliability { --theme: #607d8b; }

        .revenue .kpi-icon { background: #4caf50; }
        .orders .kpi-icon { background: #2196f3; }
        .satisfaction .kpi-icon { background: #ff9800; }
        .efficiency .kpi-icon { background: #9c27b0; }
        .cost .kpi-icon { background: #f44336; }
        .delivery .kpi-icon { background: #00bcd4; }
        .vehicles .kpi-icon { background: #795548; }
        .reliability .kpi-icon { background: #607d8b; }

        .revenue::before { background: linear-gradient(135deg, #4caf50 0%, #8bc34a 100%); }
        .orders::before { background: linear-gradient(135deg, #2196f3 0%, #03a9f4 100%); }
        .satisfaction::before { background: linear-gradient(135deg, #ff9800 0%, #ffc107 100%); }
        .efficiency::before { background: linear-gradient(135deg, #9c27b0 0%, #e91e63 100%); }
        .cost::before { background: linear-gradient(135deg, #f44336 0%, #e91e63 100%); }
        .delivery::before { background: linear-gradient(135deg, #00bcd4 0%, #009688 100%); }
        .vehicles::before { background: linear-gradient(135deg, #795548 0%, #9e9e9e 100%); }
        .reliability::before { background: linear-gradient(135deg, #607d8b 0%, #90a4ae 100%); }

        .summary-section {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
            margin-bottom: 30px;
        }

        .summary-title {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 20px;
            color: #2d3748;
        }

        .trend-chart {
            height: 300px;
            margin-top: 20px;
        }

        @media (max-width: 768px) {
            .kpi-grid {
                grid-template-columns: 1fr;
            }

            .dashboard-title {
                font-size: 24px;
            }

            .kpi-value {
                font-size: 32px;
            }
        }
    </style>
</head>
<body>
    <div class="dashboard-container">
        <div class="dashboard-header">
            <h1 class="dashboard-title">📊 核心KPI指标看板</h1>
            <p style="color: #718096;">关键绩效指标实时监控 | 数据更新时间: <span id="update-time"></span></p>
        </div>

        <!-- KPI指标卡片网格 -->
        <div class="kpi-grid">
            <!-- 营业收入 -->
            <div class="kpi-card revenue">
                <div class="kpi-header">
                    <div class="kpi-title">月度营业收入</div>
                    <div class="kpi-icon">💰</div>
                </div>
                <div class="kpi-value">
                    ¥1,258,690<span class="unit">/月</span>
                </div>
                <div class="kpi-change positive">
                    <i class="fas fa-arrow-up"></i>
                    <span>+12.5% vs 上月</span>
                </div>
                <div class="kpi-chart">
                    <canvas id="revenue-chart"></canvas>
                </div>
            </div>

            <!-- 订单总量 -->
            <div class="kpi-card orders">
                <div class="kpi-header">
                    <div class="kpi-title">日订单处理量</div>
                    <div class="kpi-icon">📦</div>
                </div>
                <div class="kpi-value">
                    678<span class="unit">单/日</span>
                </div>
                <div class="kpi-change positive">
                    <i class="fas fa-arrow-up"></i>
                    <span>+8.3% vs 昨日</span>
                </div>
                <div class="kpi-chart">
                    <canvas id="orders-chart"></canvas>
                </div>
            </div>

            <!-- 客户满意度 -->
            <div class="kpi-card satisfaction">
                <div class="kpi-header">
                    <div class="kpi-title">客户满意度评分</div>
                    <div class="kpi-icon">⭐</div>
                </div>
                <div class="kpi-value">
                    4.6<span class="unit">/5.0</span>
                </div>
                <div class="kpi-change positive">
                    <i class="fas fa-arrow-up"></i>
                    <span>+0.2 vs 上月</span>
                </div>
                <div class="kpi-chart">
                    <canvas id="satisfaction-chart"></canvas>
                </div>
            </div>

            <!-- 运营效率 -->
            <div class="kpi-card efficiency">
                <div class="kpi-header">
                    <div class="kpi-title">整体运营效率</div>
                    <div class="kpi-icon">⚡</div>
                </div>
                <div class="kpi-value">
                    89.2<span class="unit">%</span>
                </div>
                <div class="kpi-change positive">
                    <i class="fas fa-arrow-up"></i>
                    <span>+3.7% vs 上周</span>
                </div>
                <div class="kpi-chart">
                    <canvas id="efficiency-chart"></canvas>
                </div>
            </div>

            <!-- 单均成本 -->
            <div class="kpi-card cost">
                <div class="kpi-header">
                    <div class="kpi-title">单均配送成本</div>
                    <div class="kpi-icon">💸</div>
                </div>
                <div class="kpi-value">
                    ¥285<span class="unit">/单</span>
                </div>
                <div class="kpi-change negative">
                    <i class="fas fa-arrow-down"></i>
                    <span>-5.8% vs 上月</span>
                </div>
                <div class="kpi-chart">
                    <canvas id="cost-chart"></canvas>
                </div>
            </div>

            <!-- 准时交付率 -->
            <div class="kpi-card delivery">
                <div class="kpi-header">
                    <div class="kpi-title">准时交付率</div>
                    <div class="kpi-icon">🚚</div>
                </div>
                <div class="kpi-value">
                    94.8<span class="unit">%</span>
                </div>
                <div class="kpi-change positive">
                    <i class="fas fa-arrow-up"></i>
                    <span>+1.2% vs 上月</span>
                </div>
                <div class="kpi-chart">
                    <canvas id="delivery-chart"></canvas>
                </div>
            </div>

            <!-- 车辆利用率 -->
            <div class="kpi-card vehicles">
                <div class="kpi-header">
                    <div class="kpi-title">车队利用率</div>
                    <div class="kpi-icon">🚛</div>
                </div>
                <div class="kpi-value">
                    87.5<span class="unit">%</span>
                </div>
                <div class="kpi-change neutral">
                    <i class="fas fa-minus"></i>
                    <span>持平 vs 上月</span>
                </div>
                <div class="kpi-chart">
                    <canvas id="vehicles-chart"></canvas>
                </div>
            </div>

            <!-- 服务可靠性 -->
            <div class="kpi-card reliability">
                <div class="kpi-header">
                    <div class="kpi-title">服务可靠性</div>
                    <div class="kpi-icon">🛡️</div>
                </div>
                <div class="kpi-value">
                    99.2<span class="unit">%</span>
                </div>
                <div class="kpi-change positive">
                    <i class="fas fa-arrow-up"></i>
                    <span>+0.3% vs 上月</span>
                </div>
                <div class="kpi-chart">
                    <canvas id="reliability-chart"></canvas>
                </div>
            </div>
        </div>

        <!-- 综合趋势图表 -->
        <div class="summary-section">
            <h2 class="summary-title">📈 KPI综合趋势分析</h2>
            <div class="trend-chart">
                <canvas id="kpi-trend-chart"></canvas>
            </div>
        </div>
    </div>

    <script>
        // 生成随机趋势数据
        function generateMiniChart(canvasId, data, color) {
            const ctx = document.getElementById(canvasId).getContext('2d');
            new Chart(ctx, {
                type: 'line',
                data: {
                    labels: ['', '', '', '', '', '', ''],
                    datasets: [{
                        data: data,
                        borderColor: color,
                        borderWidth: 2,
                        fill: false,
                        tension: 0.4,
                        pointRadius: 0
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false },
                        tooltip: { enabled: false }
                    },
                    scales: {
                        x: { display: false },
                        y: { display: false }
                    }
                }
            });
        }

        // 生成随机数据
        function generateRandomData(points, min, max) {
            const data = [];
            for (let i = 0; i < points; i++) {
                data.push(min + Math.random() * (max - min));
            }
            return data;
        }

        // 生成各KPI迷你图表
        generateMiniChart('revenue-chart', generateRandomData(7, 100, 150), '#4caf50');
        generateMiniChart('orders-chart', generateRandomData(7, 60, 80), '#2196f3');
        generateMiniChart('satisfaction-chart', generateRandomData(7, 4.2, 4.8), '#ff9800');
        generateMiniChart('efficiency-chart', generateRandomData(7, 85, 92), '#9c27b0');
        generateMiniChart('cost-chart', generateRandomData(7, 275, 295), '#f44336');
        generateMiniChart('delivery-chart', generateRandomData(7, 92, 96), '#00bcd4');
        generateMiniChart('vehicles-chart', generateRandomData(7, 85, 90), '#795548');
        generateMiniChart('reliability-chart', generateRandomData(7, 98.5, 99.5), '#607d8b');

        // 综合趋势图表
        const trendCtx = document.getElementById('kpi-trend-chart').getContext('2d');
        const dates = [];
        for (let i = 29; i >= 0; i--) {
            const date = new Date();
            date.setDate(date.getDate() - i);
            dates.push(date.toLocaleDateString('zh-CN', { month: 'short', day: 'numeric' }));
        }

        new Chart(trendCtx, {
            type: 'line',
            data: {
                labels: dates,
                datasets: [
                    {
                        label: '营业收入',
                        data: generateRandomData(30, 1100000, 1300000),
                        borderColor: '#4caf50',
                        backgroundColor: 'rgba(76, 175, 80, 0.1)',
                        tension: 0.4,
                        yAxisID: 'y'
                    },
                    {
                        label: '订单量',
                        data: generateRandomData(30, 600, 750),
                        borderColor: '#2196f3',
                        backgroundColor: 'rgba(33, 150, 243, 0.1)',
                        tension: 0.4,
                        yAxisID: 'y1'
                    },
                    {
                        label: '客户满意度',
                        data: generateRandomData(30, 4.3, 4.8),
                        borderColor: '#ff9800',
                        backgroundColor: 'rgba(255, 152, 0, 0.1)',
                        tension: 0.4,
                        yAxisID: 'y2'
                    }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                interaction: {
                    mode: 'index',
                    intersect: false,
                },
                plugins: {
                    legend: {
                        position: 'top'
                    },
                    tooltip: {
                        mode: 'index',
                        intersect: false
                    }
                },
                scales: {
                    x: {
                        display: true,
                        title: {
                            display: true,
                            text: '日期'
                        }
                    },
                    y: {
                        type: 'linear',
                        display: true,
                        position: 'left',
                        title: {
                            display: true,
                            text: '营业收入 (万元)'
                        },
                        ticks: {
                            callback: function(value) {
                                return (value / 10000).toFixed(0);
                            }
                        }
                    },
                    y1: {
                        type: 'linear',
                        display: true,
                        position: 'right',
                        title: {
                            display: true,
                            text: '订单量'
                        },
                        grid: {
                            drawOnChartArea: false,
                        }
                    },
                    y2: {
                        type: 'linear',
                        display: false,
                        min: 4.0,
                        max: 5.0
                    }
                }
            }
        });

        // 更新时间
        function updateTime() {
            const now = new Date();
            document.getElementById('update-time').textContent = now.toLocaleString('zh-CN');
        }
        updateTime();
        setInterval(updateTime, 60000);
    </script>
</body>
</html>
